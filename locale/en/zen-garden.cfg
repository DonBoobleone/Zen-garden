[technology-description]
basic-gardening=Unlocks the ability to process wood into tree seeds.
composting=Create compost from wood and spoilage.
soil-mixing=Unlocks soil mixing.
charcoal-burning=Burn wooden chests in a smelter to get coal.
space-gardening=Unlocks advanced gardening techniques for space environments.
gear-gardening=Unlocks the Gear Garden for efficient pollution filtering.
zen-gardening=Unlocks the ability to craft decorative Zen trees and Gardens. They have passive and active pollution filtering capability.
tree-seeding-selection=Plant any Nauvis seed you wish.
zen-agriculture=Universal big agricultural tower, the Zen Tower MK2 for efficient crop cultivation with large coverage.
zen-bonsai=Unlocks Bonsai decoratives with active pollution filtering.
zen-bonsai-seeding=Zen Bonsai is designed to be pollution resistant, able to grow in low gravity, in a wide range of pressure, while having high yield in exchange for growing slower.
zen-maintenance=Destroys decals like sand dunes, and craters, while keeping vegetation intact.

