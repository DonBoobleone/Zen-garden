[mod-setting-description]
zen-seeds-enabled=Creates a seed for each tree.
zen-trees-enabled=A portable planting box version of each tree
force-basic-zen-tree-recipe=Zen-trees will use basic tree-seed\nWill be forced if 'Zen-seeds' are disabled.
bonsai-seed-enabled=Enables planting of pollution resistant Bonsai trees
zen-bonsai-decor-enabled=Enables planting box version of Bonsai trees
zen-garden-enabled=Enables the Zen and Gear gardens
zen-tower-enabled=Alternative agricultural tower mk1/mk2
zen-fountain-enabled=Alternative storage tank
move-artificial-tiles=Bricks and friends move to landscaping tab.
move-tree-seed=Tree Seed moves to landscaping tab.
invasive-forestry=Enables artificial grass on Gleba and allows tree-seeds to be planted.
fuel-pollution-overhaul=Wood has 50% pollution as fuel, while coal has 150%
charcoal-burning-enabled=Allows Wood chests to be smelted into coal.
enable-extended-grass-selection=Adds additional cosmetic texture variations to artificial grass
zen-grenade-enabled=Enables the Zen Grenade which is used for clearing decal type decoratives.